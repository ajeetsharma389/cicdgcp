name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest
    # Add these 3 lines right here! 
    permissions:
      contents: read
      id-token: write

    steps:
    - uses: actions/checkout@v4
      
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        # Paste the "Provider" path you copied from the GCP Console here:
          workload_identity_provider: 'https://iam.googleapis.com/projects/425369869110/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          
          # Type your service account email directly here:
          service_account: 'github-actions-pusher@iam-registry-lab.iam.gserviceaccount.com'

        
    - name: Configure Docker for Artifact Registry
      run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

    - name: Build and Push Docker Image
      run: |
        docker build -t us-central1-docker.pkg.dev/iam-registry-lab/my-app-repo/hello-web:v1 .
        docker push us-central1-docker.pkg.dev/iam-registry-la/my-app-repo/hello-web:v1

    
        
